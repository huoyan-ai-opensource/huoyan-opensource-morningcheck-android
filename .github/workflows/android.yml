name: Android 检查

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: App、晨检客户端与示例
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: 获取源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 设置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 设置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: 安装项目构建组件
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: 测试、编译示例与 App
        run: |
          bash gradlew --no-daemon --console=plain \
            :app:testDebugUnitTest :huoyanClient:testDebugUnitTest \
            :huoyanClient:compileExample :huoyanClient:clientDistribution \
            :app:assembleDebug :app:assembleDebugAndroidTest
          python3 -m unittest discover -s huoyanClient/tools -p 'test_*.py'
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morningcheck-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            huoyanClient/build/reports/tests/
            huoyanClient/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: 保存调试产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morningcheck-debug-and-client
          path: |
            app/build/outputs/apk/debug/*.apk
            huoyanClient/build/outputs/jar/*.jar
            huoyanClient/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
